<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理陪伴助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">心理陪伴助手</div>
        <div class="brand-sub" id="userLabel"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="newChatBtn">新对话</button>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      <button class="btn" id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="messages" id="messages"></div>
  </div>

  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
    <button class="btn btn-primary" id="sendBtn">发送</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
